<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minesweeper</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <a href="../index.html" id="menu-btn">← Menu</a>
        <div id="top-ui">
            <div id="info-row">
                <div id="mines" aria-live="polite">Mines: 40</div>
                <div id="timer" aria-live="polite">Time: 0</div>
                <div id="difficulty-label">Normal</div>
                <div id="name-input-container">
                    <input type="text" id="player-name" maxlength="12" placeholder="Name" aria-label="Player name">
                </div>
            </div>
            <div id="controls-row">
                <div id="sound-controls">
                    <button id="mute-btn" title="Mute" aria-label="Mute sound effects" aria-pressed="false">🔊</button>
                    <button id="bgm-mute-btn" title="Mute Music" aria-label="Mute music" aria-pressed="false">🎶</button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
                </div>
                <button id="pause-btn" aria-label="Pause" aria-pressed="false">Pause</button>
            </div>
        </div>
        <div id="board-wrapper">
            <canvas id="minesweeper-canvas" aria-label="Minesweeper game board"></canvas>
            <div id="pause-overlay">
                <h1 id="overlay-title">MINESWEEPER</h1>

                <!-- Difficulty Selection -->
                <div id="difficulty-selection">
                    <p class="hint">SELECT DIFFICULTY</p>
                    <div class="difficulty-buttons">
                        <button id="diff-btn-easy" data-diff="easy" class="diff-btn" style="border-color: #4ade80; color: #4ade80;">
                            FÁCIL
                        </button>
                        <button id="diff-btn-normal" data-diff="normal" class="diff-btn active" style="border-color: #fbbf24; color: #fbbf24;">
                            NORMAL
                        </button>
                        <button id="diff-btn-hard" data-diff="hard" class="diff-btn" style="border-color: #f87171; color: #f87171;">
                            DIFÍCIL
                        </button>
                    </div>
                </div>

                <button id="start-btn">START</button>

                <div id="game-over-card" style="display:none;">
                    <h1 id="game-over-title">GAME OVER</h1>
                    <div id="game-over-stats">
                        <div id="final-score">Score: 0</div>
                        <div id="final-time">Time: 0s</div>
                    </div>
                    <button id="quick-restart-btn">PLAY AGAIN</button>
                    <div id="high-scores-table">
                        <h3>Top 5 Records</h3>
                        <table id="high-scores-list"></table>
                    </div>
                </div>
            </div>
        </div>

        <div id="touch-controls">
            <button class="touch-btn" data-action="flag" title="Flag mode" aria-label="Flag mode">⚑</button>
            <button class="touch-btn" data-action="pause" title="Pause" aria-label="Pause">⏸</button>
            <button class="touch-btn" data-action="restart" title="Restart" aria-label="Restart">↻</button>
        </div>
    </div>
    <script src="js/constants.js"></script>
    <script src="js/domain/board.js"></script>
    <script src="js/domain/game.js"></script>
    <script src="js/ports/repository.js"></script>
    <script src="js/ports/renderer.js"></script>
    <script src="js/ports/input.js"></script>
    <script src="js/ports/sound.js"></script>
    <script src="js/ports/clock.js"></script>
    <script src="js/adapters/localStorage.js"></script>
    <script src="js/adapters/canvas.js"></script>
    <script src="js/adapters/keyboard.js"></script>
    <script src="js/adapters/touch.js"></script>
    <script src="js/adapters/sound.js"></script>
    <script src="js/adapters/timer.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
