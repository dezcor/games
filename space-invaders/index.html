<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div class="top-bar">
            <a href="../index.html" id="menu-btn">◂ MENU</a>
            <div class="top-tools">
                <div class="sound-menu">
                    <button class="touch-btn cap is-sm c-white sound-toggle" aria-label="Sound settings" aria-expanded="false" aria-controls="sound-controls">♪</button>
                    <div id="sound-controls" hidden>
                        <div class="arcade-key is-sm">
                            <button id="mute-btn" class="touch-btn cap c-white" title="Mute sound effects" aria-label="Mute sound effects">🔊</button>
                            <span class="arcade-label">SFX</span>
                        </div>
                        <div class="arcade-key is-sm">
                            <button id="bgm-mute-btn" class="touch-btn cap c-white" title="Mute music" aria-label="Mute music">🎵</button>
                            <span class="arcade-label">MUSIC</span>
                        </div>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Sound effects volume">
                    </div>
                </div>
                <button id="pause-btn" class="touch-btn cap c-yellow" aria-label="Pause" aria-pressed="false">PAUSE</button>
            </div>
        </div>
        <div id="top-ui">
            <div id="info-row">
                <div id="score" aria-live="polite">Score: 0</div>
                <div id="lives" aria-live="polite">Lives: 3</div>
                <div id="combo-display" aria-live="polite"></div>
                <div id="best-score">Best: <span id="best-score-value">0</span></div>
                <div id="name-input-container">
                    <input type="text" id="player-name" maxlength="12" placeholder="Name" aria-label="Player name">
                </div>
            </div>
            <div id="difficulty-buttons">
                <button class="diff-btn" data-diff="easy">Easy</button>
                <button class="diff-btn active" data-diff="normal">Normal</button>
                <button class="diff-btn" data-diff="hard">Hard</button>
                <button class="diff-btn" data-diff="insane">Insane</button>
            </div>
        </div>
        <div id="board-wrapper">
            <canvas id="invaders" width="240" height="400" aria-label="Space Invaders game board"></canvas>
            <div id="level-banner" style="display:none;"></div>
            <div id="pause-overlay">
                <h1 id="overlay-title">SPACE INVADERS</h1>
                <div id="game-over-stats" style="display:none;">
                    <div id="final-score">Score: 0</div>
                    <div id="final-level">Level: 1</div>
                </div>
                <button id="start-btn" class="touch-btn cap is-xl is-ring c-fire">START</button>
                <button id="quick-restart-btn" class="touch-btn cap is-xl is-ring c-yellow" style="display:none;">PLAY<br>AGAIN</button>
                <div id="high-scores-table" style="display:none;">
                    <h3>Top 5 Records</h3>
                    <table id="high-scores-list"></table>
                </div>
            </div>
        </div>
        <div id="touch-controls" class="deck">
            <div class="stick-key">
                <div class="joystick" role="group" aria-label="Movement">
                    <button class="touch-btn joy-zone joy-left" data-action="left" title="Move left" aria-label="Move left"></button>
                    <button class="touch-btn joy-zone joy-right" data-action="right" title="Move right" aria-label="Move right"></button>
                    <span class="joy-gate" aria-hidden="true"></span>
                    <span class="joy-shaft" aria-hidden="true"><span class="joy-ball"></span></span>
                </div>
                <span class="arcade-label">MOVE</span>
            </div>
            <div class="arcade-key is-lg">
                <button class="touch-btn cap c-fire" data-action="shoot" title="Shoot" aria-label="Shoot">●</button>
                <span class="arcade-label">FIRE</span>
            </div>
            <div class="arcade-key">
                <button class="touch-btn cap c-white" data-action="restart" title="Restart" aria-label="Restart">↻</button>
                <span class="arcade-label">RESTART</span>
            </div>
        </div>
    </div>
    <script src="../shared/sound-menu.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
