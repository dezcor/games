<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hook Run</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../shared/layout.css">
</head>
<body>
    <div id="game-container">
        <div class="top-bar">
            <a href="../index.html" id="menu-btn">◂ MENU</a>
            <div class="top-tools">
                <div class="sound-menu">
                    <button class="touch-btn cap is-sm c-cyan sound-toggle" aria-label="Sound settings" aria-expanded="false" aria-controls="sound-controls">♪</button>
                    <div id="sound-controls" hidden>
                        <div class="arcade-key is-sm">
                            <button id="mute-btn" class="touch-btn cap c-cyan" title="Mute" aria-label="Mute sound effects" aria-pressed="false">🔊</button>
                            <span class="arcade-label">SFX</span>
                        </div>
                        <div class="arcade-key is-sm">
                            <button id="bgm-mute-btn" class="touch-btn cap c-yellow" title="Mute Music" aria-label="Mute music" aria-pressed="false">🎵</button>
                            <span class="arcade-label">MUSIC</span>
                        </div>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Sound effects volume">
                    </div>
                </div>
                <button id="pause-btn" data-keys="KeyP Escape" class="touch-btn cap is-sm c-orange" aria-label="Pause" aria-pressed="false">II</button>
            </div>
        </div>
        <div id="top-ui">
            <div id="info-row">
                <div id="score" aria-live="polite">Score: 0</div>
                <div id="best-score">Best: <span id="best-score-value">0</span></div>
                <div id="name-input-container">
                    <input type="text" id="player-name" maxlength="12" placeholder="Name" aria-label="Player name">
                </div>
            </div>
        </div>
        <div class="board-slot">
            <div id="board-wrapper">
                <canvas id="hookrun" width="480" height="360" aria-label="Hook Run game board"></canvas>
                <div id="pause-overlay">
                    <h1 id="overlay-title">HOOK RUN</h1>
                    <button id="start-btn" data-keys="Enter" class="touch-btn cap is-xl is-ring c-orange">START</button>
                    <div id="high-scores-table" style="display:none;">
                        <h3>Top 5 Records</h3>
                        <table id="high-scores-list"></table>
                    </div>
                </div>
            </div>
        </div>
        <div id="touch-controls" class="deck">
            <div class="arcade-key">
                <button class="touch-btn cap is-xl c-amber" data-action="gancho" data-keys="ArrowUp KeyW" title="Gancho (hold to swing)" aria-label="Gancho">GANCHO</button>
                <span class="arcade-label">GANCHO · HOLD</span>
            </div>
            <div class="action-pair">
                <div class="arcade-key">
                    <button class="touch-btn cap c-green" data-action="jump" data-keys="Space" title="Saltar" aria-label="Saltar">SALTAR</button>
                    <span class="arcade-label">SALTAR</span>
                </div>
                <div class="arcade-key is-lg">
                    <button class="touch-btn cap c-red" data-action="shoot" data-keys="KeyX" title="Disparar" aria-label="Disparar">DISPARAR</button>
                    <span class="arcade-label">DISPARAR</span>
                </div>
            </div>
            <div class="arcade-key">
                <button class="touch-btn cap is-sm c-yellow" data-action="restart" data-keys="KeyR" title="Restart" aria-label="Restart">↻</button>
                <span class="arcade-label">RESTART</span>
            </div>
        </div>
        <dl class="key-help" aria-label="Keyboard controls">
            <dt><kbd>↑</kbd></dt><dd>Hold · gancho</dd>
            <dt><kbd>Space</kbd></dt><dd>Jump</dd>
            <dt><kbd>X</kbd></dt><dd>Fire</dd>
            <dt><kbd>Enter</kbd></dt><dd>Start</dd>
            <dt><kbd>P</kbd></dt><dd>Pause</dd>
            <dt><kbd>R</kbd></dt><dd>Restart</dd>
        </dl>
    </div>
    <script src="../shared/sound-menu.js"></script>
    <script src="../shared/key-press.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/domain/player.js"></script>
    <script src="js/domain/world.js"></script>
    <script src="js/domain/powers.js"></script>
    <script src="js/domain/game.js"></script>
    <script src="js/ports/repository.js"></script>
    <script src="js/ports/clock.js"></script>
    <script src="js/ports/random.js"></script>
    <script src="js/ports/renderer.js"></script>
    <script src="js/ports/hud.js"></script>
    <script src="js/ports/sound.js"></script>
    <script src="js/ports/input.js"></script>
    <script src="js/adapters/sound.js"></script>
    <script src="js/adapters/localStorage.js"></script>
    <script src="js/adapters/frame.js"></script>
    <script src="js/adapters/random.js"></script>
    <script src="js/adapters/canvas.js"></script>
    <script src="js/adapters/dom.js"></script>
    <script src="js/adapters/keyboard.js"></script>
    <script src="js/adapters/touch.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
