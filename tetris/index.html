<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <a href="../index.html" id="menu-btn">◂ MENU</a>
        <div id="top-ui">
            <div id="info-row">
                <div id="score" aria-live="polite">Score: 0</div>
                <div id="level">Level: 1</div>
                <div id="best-score">Best: <span id="best-score-value">0</span></div>
                <div id="name-input-container">
                    <input type="text" id="player-name" maxlength="12" placeholder="Name" aria-label="Player name">
                </div>
            </div>
            <div id="controls-row">
                <div id="sound-controls">
                    <div class="arcade-key is-sm">
                        <button id="mute-btn" class="touch-btn cap c-mint" title="Mute" aria-label="Mute sound effects" aria-pressed="false">🔊</button>
                        <span class="arcade-label">SFX</span>
                    </div>
                    <div class="arcade-key is-sm">
                        <button id="bgm-mute-btn" class="touch-btn cap c-coral" title="Mute Music" aria-label="Mute music" aria-pressed="false">🎵</button>
                        <span class="arcade-label">MUSIC</span>
                    </div>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Sound effects volume">
                </div>
                <div id="next-piece-container">
                    <span>Next</span>
                    <canvas id="next-canvas" width="80" height="80" aria-label="Next piece preview"></canvas>
                </div>
                <div class="arcade-key is-sm">
                    <button id="pause-btn" class="touch-btn cap c-amber" aria-label="Pause" aria-pressed="false">II</button>
                    <span class="arcade-label">PAUSE</span>
                </div>
            </div>
        </div>
        <div id="board-wrapper">
            <canvas id="tetris" width="240" height="400" aria-label="Tetris game board"></canvas>
            <div id="combo-banner" aria-live="polite" aria-atomic="true"></div>
            <div id="pause-overlay">
                <h1 id="overlay-title">TETRIS</h1>
                <button id="start-btn" class="touch-btn cap is-xl is-ring c-mint">START</button>
                <div id="high-scores-table" style="display:none;">
                    <h3>Top 5 Records</h3>
                    <table id="high-scores-list"></table>
                </div>
            </div>
        </div>
        <div id="touch-controls" class="deck">
            <div class="stick-key">
                <div class="joystick" role="group" aria-label="Movement">
                    <button class="touch-btn joy-zone joy-up" data-action="rotate" title="Rotate" aria-label="Rotate"></button>
                    <button class="touch-btn joy-zone joy-right" data-action="right" title="Right" aria-label="Move right"></button>
                    <button class="touch-btn joy-zone joy-down" data-action="down" title="Down" aria-label="Soft drop"></button>
                    <button class="touch-btn joy-zone joy-left" data-action="left" title="Left" aria-label="Move left"></button>
                    <span class="joy-gate" aria-hidden="true"></span>
                    <span class="joy-shaft" aria-hidden="true"><span class="joy-ball"></span></span>
                </div>
                <span class="arcade-label">MOVE · ROTATE</span>
            </div>
            <div class="arcade-key is-lg">
                <button class="touch-btn cap c-amber" data-action="drop" title="Hard Drop" aria-label="Hard drop">▼</button>
                <span class="arcade-label">DROP</span>
            </div>
            <div class="arcade-key">
                <button class="touch-btn cap c-coral" data-action="restart" title="Restart" aria-label="Restart">↻</button>
                <span class="arcade-label">RESTART</span>
            </div>
        </div>
    </div>
    <script src="js/constants.js"></script>
    <script src="js/tetriminos.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
