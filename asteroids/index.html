<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Asteroids</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div class="top-bar">
            <a href="../index.html" id="menu-btn">◂ MENU</a>
            <div class="top-tools">
                <div class="sound-menu">
                    <button class="touch-btn cap is-sm c-vector sound-toggle" aria-label="Sound settings" aria-expanded="false" aria-controls="sound-controls">♪</button>
                    <div id="sound-controls" hidden>
                        <div class="arcade-key is-sm">
                            <button id="mute-btn" class="touch-btn cap c-vector" title="Mute" aria-label="Mute sound effects" aria-pressed="false">🔊</button>
                            <span class="arcade-label">SFX</span>
                        </div>
                        <div class="arcade-key is-sm">
                            <button id="bgm-mute-btn" class="touch-btn cap c-magenta" title="Mute Music" aria-label="Mute music" aria-pressed="false">🎵</button>
                            <span class="arcade-label">MUSIC</span>
                        </div>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
                    </div>
                </div>
                <button id="pause-btn" class="touch-btn cap is-sm c-white" aria-label="Pause" aria-pressed="false">II</button>
                <button class="touch-btn cap is-sm c-amber" data-action="restart" title="Restart" aria-label="Restart">↻</button>
            </div>
        </div>
        <div id="top-ui">
            <div id="info-row">
                <div id="score" aria-live="polite">Score: 0</div>
                <div id="lives">Lives: 3</div>
                <div id="level">Level: 1</div>
                <div id="best-score">Best: <span id="best-score-value">0</span></div>
                <div id="name-input-container">
                    <input type="text" id="player-name" maxlength="12" placeholder="Name" aria-label="Player name">
                </div>
            </div>
            <div id="powerup-status"></div>
        </div>
        <div id="board-wrapper">
            <canvas id="asteroids-canvas" aria-label="Asteroids game board"></canvas>
            <div id="zoom-indicator" aria-hidden="true">100%</div>
            <div id="level-banner" style="display:none;"></div>
            <div id="pause-overlay">
                <h1 id="overlay-title">ASTEROIDS</h1>

                <!-- Difficulty Selection -->
                <div id="difficulty-selection">
                    <p class="hint">SELECT DIFFICULTY</p>
                    <div class="difficulty-buttons">
                        <button id="diff-btn-easy" data-diff="easy" class="diff-btn">FÁCIL</button>
                        <button id="diff-btn-normal" data-diff="normal" class="diff-btn active">NORMAL</button>
                        <button id="diff-btn-hard" data-diff="hard" class="diff-btn">DIFÍCIL</button>
                        <button id="diff-btn-insane" data-diff="insane" class="diff-btn">LOCO</button>
                    </div>
                </div>

                <!-- Ship Skin Selection -->
                <div id="ship-skin-selection">
                    <p class="hint">SHIP COLOR</p>
                    <div id="skin-swatches" role="radiogroup" aria-label="Ship color"></div>
                </div>

                <!-- Achievements Panel -->
                <div id="achievements-panel" style="display:none;">
                    <h3>Achievements</h3>
                    <ul id="achievements-list" role="list"></ul>
                </div>
                <button id="achievements-btn" type="button" aria-expanded="false" aria-controls="achievements-panel">Achievements</button>
                <button id="start-btn" class="touch-btn cap is-xl is-ring c-vector">START</button>

                <div id="game-over-card" style="display:none;">
                    <h1 id="game-over-title">GAME OVER</h1>
                    <div id="game-over-stats">
                        <div id="final-score">Score: 0</div>
                        <div id="final-level">Level: 1</div>
                    </div>
                    <button id="quick-restart-btn" class="touch-btn cap is-xl is-ring c-magenta">PLAY<br>AGAIN</button>
                    <div id="high-scores-table">
                        <h3>Top 5 Records</h3>
                        <table id="high-scores-list"></table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tutorial Overlay -->
        <div id="tutorial-overlay" role="dialog" aria-labelledby="tutorial-title" aria-modal="true" style="display:none;">
            <div class="tutorial-content">
                <div id="tutorial-icon" aria-hidden="true"></div>
                <h2 id="tutorial-title"></h2>
                <p id="tutorial-body"></p>
                <div id="tutorial-dots" role="tablist" aria-label="Tutorial steps"></div>
                <div class="tutorial-controls">
                    <button id="tutorial-prev" type="button" aria-label="Previous step">←</button>
                    <button id="tutorial-next" type="button" aria-label="Next step">→</button>
                    <button id="tutorial-skip" type="button" aria-label="Skip tutorial">Saltar</button>
                </div>
                <label class="tutorial-dismiss">
                    <input type="checkbox" id="tutorial-dismiss-cb">
                    <span>No mostrar de nuevo</span>
                </label>
            </div>
        </div>

        <!-- Achievement Toast -->
        <div id="achievement-toast" role="status" aria-live="polite" style="display:none;">
            <span id="achievement-toast-icon" aria-hidden="true"></span>
            <div>
                <div class="ach-toast-label">¡Logro desbloqueado!</div>
                <div id="achievement-toast-text"></div>
            </div>
        </div>

        <div id="touch-controls" class="deck">
            <div class="stick-key">
                <div class="joystick" role="group" aria-label="Ship controls">
                    <button class="touch-btn joy-zone joy-left" data-action="left" title="Turn left" aria-label="Left"></button>
                    <button class="touch-btn joy-zone joy-up" data-action="thrust" title="Thrust" aria-label="Thrust"></button>
                    <button class="touch-btn joy-zone joy-right" data-action="right" title="Turn right" aria-label="Right"></button>
                    <span class="joy-gate" aria-hidden="true"></span>
                    <span class="joy-shaft" aria-hidden="true"><span class="joy-ball"></span></span>
                </div>
                <span class="arcade-label">TURN · THRUST</span>
            </div>
            <div class="arcade-key is-lg">
                <button class="touch-btn cap c-magenta" data-action="shoot" title="Shoot" aria-label="Shoot">●</button>
                <span class="arcade-label">FIRE</span>
            </div>
            <div class="arcade-key">
                <button class="touch-btn cap c-vector" data-action="hyperespace" title="Hyperspace (H)" aria-label="Hyperspace">⇋</button>
                <span class="arcade-label">HYPER</span>
            </div>
        </div>
    </div>
    <script src="../shared/sound-menu.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
