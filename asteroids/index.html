<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Asteroids</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <a href="../index.html" id="menu-btn">← Menu</a>
        <div id="top-ui">
            <div id="info-row">
                <div id="score" aria-live="polite">Score: 0</div>
                <div id="lives">Lives: 3</div>
                <div id="level">Level: 1</div>
                <div id="best-score">Best: <span id="best-score-value">0</span></div>
                <div id="name-input-container">
                    <input type="text" id="player-name" maxlength="12" placeholder="Name" aria-label="Player name">
                </div>
            </div>
            <div id="powerup-status"></div>
            <div id="controls-row">
                <div id="sound-controls">
                    <button id="mute-btn" title="Mute" aria-label="Mute sound effects" aria-pressed="false">🔊</button>
                    <button id="bgm-mute-btn" title="Mute Music" aria-label="Mute music" aria-pressed="false">🎵</button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
                </div>
                <button id="pause-btn" aria-label="Pause" aria-pressed="false">Pause</button>
            </div>
        </div>
        <div id="board-wrapper">
            <canvas id="asteroids-canvas" aria-label="Asteroids game board"></canvas>
            <div id="zoom-indicator" aria-hidden="true">100%</div>
            <div id="level-banner" style="display:none;"></div>
            <div id="pause-overlay">
                <h1 id="overlay-title">ASTEROIDS</h1>

                <!-- Difficulty Selection -->
                <div id="difficulty-selection">
                    <p class="hint">SELECT DIFFICULTY</p>
                    <div class="difficulty-buttons">
                        <button id="diff-btn-easy" data-diff="easy" class="diff-btn" style="border-color: #4ade80; color: #4ade80;">
                            FÁCIL
                        </button>
                        <button id="diff-btn-normal" data-diff="normal" class="diff-btn active" style="border-color: #fbbf24; color: #fbbf24;">
                            NORMAL
                        </button>
                        <button id="diff-btn-hard" data-diff="hard" class="diff-btn" style="border-color: #f87171; color: #f87171;">
                            DIFÍCIL
                        </button>
                        <button id="diff-btn-insane" data-diff="insane" class="diff-btn" style="border-color: #d946ef; color: #d946ef;">
                            LOCO
                        </button>
                    </div>
                </div>

                <!-- Ship Skin Selection -->
                <div id="ship-skin-selection">
                    <p class="hint">SHIP COLOR</p>
                    <div id="skin-swatches" role="radiogroup" aria-label="Ship color"></div>
                </div>

                <!-- Achievements Panel -->
                <div id="achievements-panel" style="display:none;">
                    <h3>Achievements</h3>
                    <ul id="achievements-list" role="list"></ul>
                </div>
                <button id="achievements-btn" type="button" aria-expanded="false" aria-controls="achievements-panel">Achievements</button>
                <button id="start-btn">START</button>

                <div id="game-over-card" style="display:none;">
                    <h1 id="game-over-title">GAME OVER</h1>
                    <div id="game-over-stats">
                        <div id="final-score">Score: 0</div>
                        <div id="final-level">Level: 1</div>
                    </div>
                    <button id="quick-restart-btn">PLAY AGAIN</button>
                    <div id="high-scores-table">
                        <h3>Top 5 Records</h3>
                        <table id="high-scores-list"></table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tutorial Overlay -->
        <div id="tutorial-overlay" role="dialog" aria-labelledby="tutorial-title" aria-modal="true" style="display:none;">
            <div class="tutorial-content">
                <div id="tutorial-icon" aria-hidden="true"></div>
                <h2 id="tutorial-title"></h2>
                <p id="tutorial-body"></p>
                <div id="tutorial-dots" role="tablist" aria-label="Tutorial steps"></div>
                <div class="tutorial-controls">
                    <button id="tutorial-prev" type="button" aria-label="Previous step">←</button>
                    <button id="tutorial-next" type="button" aria-label="Next step">→</button>
                    <button id="tutorial-skip" type="button" aria-label="Skip tutorial">Saltar</button>
                </div>
                <label class="tutorial-dismiss">
                    <input type="checkbox" id="tutorial-dismiss-cb">
                    <span>No mostrar de nuevo</span>
                </label>
            </div>
        </div>

        <!-- Achievement Toast -->
        <div id="achievement-toast" role="status" aria-live="polite" style="display:none;">
            <span id="achievement-toast-icon" aria-hidden="true"></span>
            <div>
                <div class="ach-toast-label">¡Logro desbloqueado!</div>
                <div id="achievement-toast-text"></div>
            </div>
        </div>
        <div id="touch-controls">
            <button class="touch-btn" data-action="left" title="Left" aria-label="Left">
                <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 10L14 16V4L4 10Z" fill="#22d3ee"/></svg>
            </button>
            <button class="touch-btn" data-action="thrust" title="Thrust" aria-label="Thrust">▲</button>
            <button class="touch-btn" data-action="right" title="Right" aria-label="Right">
                <svg width="20" height="20" viewBox="0 0 20 20"><path d="M16 10L6 4V16L16 10Z" fill="#22d3ee"/></svg>
            </button>
            <button class="touch-btn" data-action="shoot" title="Shoot" aria-label="Shoot">
                <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2v6l3-3 2 2-5 5-5-5 2-2 3 3V2h4z" fill="#fbbf24"/></svg>
            </button>
            <button class="touch-btn" data-action="hyperespace" title="Hyperspace (H)" aria-label="Hyperspace">⇋</button>
            <button class="touch-btn" data-action="pause" title="Pause" aria-label="Pause">⏸</button>
            <button class="touch-btn" data-action="restart" title="Restart" aria-label="Restart">↻</button>
        </div>
    </div>
    <script src="js/constants.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
