<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="top-bar">
            <a href="../index.html" id="menu-btn">◂ MENU</a>
            <div class="sound-menu">
                <button class="touch-btn cap is-sm c-amber sound-toggle" aria-label="Sound settings" aria-expanded="false" aria-controls="sound-controls">♪</button>
                <div id="sound-controls" hidden>
                    <div class="arcade-key is-sm">
                        <button id="mute-btn" class="touch-btn cap c-amber" title="Mute" aria-label="Mute sound effects" aria-pressed="false">🔊</button>
                        <span class="arcade-label">SFX</span>
                    </div>
                    <div class="arcade-key is-sm">
                        <button id="bgm-mute-btn" class="touch-btn cap c-amber" title="Mute Music" aria-label="Mute music" aria-pressed="false">🎵</button>
                        <span class="arcade-label">MUSIC</span>
                    </div>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
                </div>
            </div>
        </div>
        <div class="score-row">
            <div id="score" aria-live="polite">0</div>
            <div id="highScore">BEST: 0</div>
        </div>
        <div class="board-wrapper">
            <canvas id="gameCanvas" width="400" height="400" aria-label="Snake game board"></canvas>
            <div id="game-over" class="hidden">
                <h1>GAME OVER</h1>
                <div class="final-score" id="final-score-text">Score: 0</div>
                <div class="arcade-key is-xl">
                    <button class="cap c-green restart-btn" onclick="window.resetGame()" aria-label="Restart game">↻</button>
                    <span class="arcade-label">RESTART</span>
                </div>
            </div>
        </div>
        <div id="touch-controls" class="deck">
            <div class="joystick" role="group" aria-label="Direction">
                <button class="touch-btn joy-zone joy-up" data-action="up" aria-label="Move up"></button>
                <button class="touch-btn joy-zone joy-right" data-action="right" aria-label="Move right"></button>
                <button class="touch-btn joy-zone joy-down" data-action="down" aria-label="Move down"></button>
                <button class="touch-btn joy-zone joy-left" data-action="left" aria-label="Move left"></button>
                <span class="joy-gate" aria-hidden="true"></span>
                <span class="joy-shaft" aria-hidden="true"><span class="joy-ball"></span></span>
            </div>
            <div class="arcade-key">
                <button class="touch-btn cap c-green" data-action="restart" aria-label="Restart">↻</button>
                <span class="arcade-label">RESTART</span>
            </div>
        </div>
    </div>
    <script src="../shared/sound-menu.js"></script>
    <script src="sound.js"></script>
    <script src="game.js"></script>
</body>
</html>
